services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: timeflow
      POSTGRES_USER: timeflow
      POSTGRES_PASSWORD: timeflow
    ports:
      - "5432:5432"
    volumes:
      - timeflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timeflow -d timeflow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  timeflow-postgres:
