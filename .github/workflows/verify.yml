name: Verify TimeFlow
on:
  push:
    branches: [main, 'fix/**', 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: timeflow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U postgres -d timeflow_test'
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TIMEFLOW_TEST_DB: 'true'
      DB_URL: jdbc:postgresql://localhost:5432/timeflow_test
      DB_USERNAME: postgres
      DB_PASSWORD: ci-ephemeral-only
      TIMEFLOW_AUTO_BOOTSTRAP_ADMIN: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Backend tests, PostgreSQL integration and package
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend tests
        working-directory: frontend
        run: npm test
      - name: Angular production build
        working-directory: frontend
        run: npm run build
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive reviewed source without git credentials
        run: git archive --format=zip --output=timeflow-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: timeflow-source
          path: timeflow-source.zip
          retention-days: 7
